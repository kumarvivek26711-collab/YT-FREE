<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>YT Pro 📺</title>
  <meta name="description" content="YouTube videos bina ads ke — Premium UI" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ff0055' rx='20' width='100' height='100'/><text y='75' font-size='70' font-weight='bold' fill='%23fff' text-anchor='middle' x='50'>▶</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#050505" />
  
  <!-- Modern Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #050505; color: #fff; -webkit-tap-highlight-color: transparent; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff0055; }

    /* Glassmorphism Header */
    .glass-header {
      background: rgba(5, 5, 5, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: sticky; top: 0; z-index: 100;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    }

    /* Search Box */
    .search-box {
      flex: 1; display: flex; background: #141414; border: 1px solid #222; 
      border-radius: 24px; padding: 2px 4px; transition: all 0.3s ease;
    }
    .search-box:focus-within { border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.2); }
    .search-input {
      flex: 1; background: transparent; border: none; color: #fff; padding: 8px 16px; 
      font-size: 14px; outline: none; font-weight: 500;
    }

    /* Category Buttons */
    .cat-container {
      display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .cat-container::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #141414; color: #888; border: 1px solid #222; border-radius: 20px;
      padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: all 0.3s ease; display: flex; gap: 6px; align-items: center;
    }
    .cat-btn:hover { background: #222; color: #fff; }
    .cat-btn.active {
      background: linear-gradient(135deg, #ff0055, #ff0099);
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.35);
    }

    /* Video Cards */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; padding: 16px; max-width: 1200px; margin: 0 auto;
    }
    .card {
      background: #0a0a0a; border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 0, 85, 0.4);
      box-shadow: 0 12px 25px rgba(255, 0, 85, 0.15);
    }
    .thumb-wrap { position: relative; padding-bottom: 56.25%; background: #111; overflow: hidden; }
    .thumb-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .card:hover .thumb-wrap img { transform: scale(1.05); }
    .play-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex;
      align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;
    }
    .card:hover .play-overlay { opacity: 1; }
    .play-btn {
      width: 50px; height: 50px; background: #ff0055; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      padding-left: 4px; box-shadow: 0 4px 15px rgba(255,0,85,0.5);
    }
    
    .card-info { padding: 14px; }
    .vid-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; 
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .vid-channel { color: #888; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .vid-stats { color: #555; font-size: 11px; font-weight: 500; }

    /* Skeleton Loading */
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    .skeleton { background: #141414; animation: pulse 1.5s infinite; border-radius: 16px; overflow: hidden; }
    .skel-img { padding-bottom: 56.25%; background: #1f1f1f; }
    .skel-text { height: 14px; background: #1f1f1f; margin: 14px; border-radius: 4px; }
    .skel-text.short { width: 60%; margin-top: 0; }

    .logo-box {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #ff0055, #ff0099);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; box-shadow: 0 4px 12px rgba(255,0,85,0.4);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const BACKEND_URL = "https://yt-free.onrender.com";

    const CATS = [
      { id: "all", icon: "🔥", label: "Trending" },
      { id: "10",  icon: "🎵", label: "Music" },
      { id: "20",  icon: "🎮", label: "Gaming" },
      { id: "1",   icon: "🎬", label: "Movies" },
      { id: "24",  icon: "🎭", label: "Comedy" },
      { id: "17",  icon: "⚽", label: "Sports" },
      { id: "28",  icon: "💻", label: "Tech" },
    ];

    function fmt(n) {
      if (!n) return "";
      const x = parseInt(n);
      if (x >= 1e9) return (x/1e9).toFixed(1)+"B";
      if (x >= 1e6) return (x/1e6).toFixed(1)+"M";
      if (x >= 1e3) return (x/1e3).toFixed(1)+"K";
      return String(x);
    }

    function ago(d) {
      if (!d) return "";
      const days = Math.floor((Date.now() - new Date(d)) / 86400000);
      if (!days) return "New";
      if (days < 7) return days + "d";
      if (days < 30) return Math.floor(days/7) + "w";
      return Math.floor(days/30) + "mo";
    }

    function getVid(v) { return typeof v.id === "string" ? v.id : (v.id?.videoId || ""); }
    function App() {
      const [videos, setVideos] = useState([]);
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(false);
      const [query, setQuery] = useState("");
      const [activeCat, setActiveCat] = useState("all");

      async function fetchVideos(cat) {
        setLoading(true); setVideos([]);
        try {
          let url = `${BACKEND_URL}/api/trending?maxResults=24`;
          if (cat && cat !== "all") url += `&categoryId=${cat}`;
          if (query && !cat) url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}&maxResults=24`;
          
          const res = await fetch(url);
          const data = await res.json();
          if (!data.error) setVideos(data.items || []);
        } catch (e) { console.error(e); }
        setLoading(false);
      }

      useEffect(() => { fetchVideos("all"); }, []);

      if (selected) {
        const vid = getVid(selected);
        const s = selected.snippet || {};
        return (
          <div>
            <div className="glass-header">
              <button onClick={() => setSelected(null)} 
                style={{background:"#1a1a1a", border:"none", color:"#fff", width:"40px", height:"40px", borderRadius:"50%", cursor:"pointer", fontSize:"20px"}}>
                ←
              </button>
              <h3 style={{fontWeight:600, fontSize:"15px", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>
                {s.title}
              </h3>
            </div>
            <div style={{maxWidth:900, margin:"0 auto", padding:"20px 16px"}}>
              <div style={{position:"relative", paddingBottom:"56.25%", borderRadius:"16px", overflow:"hidden", background:"#000", boxShadow:"0 10px 30px rgba(0,0,0,0.8)"}}>
                <iframe src={`https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0`}
                  style={{position:"absolute", inset:0, width:"100%", height:"100%", border:"none"}} allowFullScreen />
              </div>
              <h2 style={{fontSize:"18px", fontWeight:700, margin:"16px 0 8px"}}>{s.title}</h2>
              <div style={{display:"flex", alignItems:"center", gap:"10px"}}>
                <div style={{background:"#141414", padding:"6px 12px", borderRadius:"20px", fontSize:"13px", color:"#aaa", border:"1px solid #222"}}>
                  📺 {s.channelTitle}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div>
          <div className="glass-header">
            <div className="logo-box">▶</div>
            <div className="search-box">
              <input className="search-input" value={query} onChange={e => setQuery(e.target.value)} 
                placeholder="Search premium..." onKeyDown={e => e.key==="Enter" && (setActiveCat(""), fetchVideos(null))} />
              <button onClick={() => { setActiveCat(""); fetchVideos(null); }} 
                style={{background:"transparent", border:"none", color:"#888", padding:"0 16px", cursor:"pointer", fontSize:"18px"}}>
                🔍
              </button>
            </div>
          </div>

          <div className="cat-container">
            {CATS.map(cat => (
              <button key={cat.id} className={`cat-btn ${activeCat === cat.id ? 'active' : ''}`}
                onClick={() => { setActiveCat(cat.id); setQuery(""); fetchVideos(cat.id); }}>
                {cat.icon} {cat.label}
              </button>
            ))}
          </div>

          <div className="grid">
            {loading ? Array(12).fill(0).map((_, i) => (
              <div key={i} className="skeleton">
                <div className="skel-img"></div>
                <div className="skel-text"></div>
                <div className="skel-text short"></div>
              </div>
            )) : videos.map(v => {
              const s = v.snippet || {}; const st = v.statistics || {};
              return (
                <div key={getVid(v)} className="card" onClick={() => setSelected(v)}>
                  <div className="thumb-wrap">
                    <img src={s.thumbnails?.medium?.url || ""} loading="lazy" />
                    <div className="play-overlay"><div className="play-btn">▶</div></div>
                  </div>
                  <div className="card-info">
                    <div className="vid-title">{s.title}</div>
                    <div className="vid-channel">{s.channelTitle}</div>
                    <div className="vid-stats">
                      {st.viewCount ? fmt(st.viewCount)+" views • " : ""}{ago(s.publishedAt)}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          
          {!loading && videos.length === 0 && (
            <div style={{textAlign:"center", padding:"60px 20px", color:"#444"}}>
              <div style={{fontSize:"50px", marginBottom:"15px"}}>🔍</div>
              <h3>Kuch nahi mila</h3>
              <p style={{fontSize:"13px", marginTop:"5px"}}>Koi aur keyword try karein</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }
  </script>
</body>
</html>
