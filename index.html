<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jugadu Tube 📺</title>
  <meta name="description" content="Clean YouTube without ads" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ffffff' rx='50' width='100' height='100'/><text y='75' font-size='70' font-weight='bold' fill='%23111' text-anchor='middle' x='54'>▶</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  
  <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body, html { background: #f5f5f7; color: #1d1d1f; -webkit-tap-highlight-color: transparent; width: 100%; min-height: 100vh; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 0px; display: none; }

    /* Header */
    .glass-header {
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e5ea; position: sticky; top: 0; z-index: 100;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    
    .brand-btn { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-box {
      width: 36px; height: 36px; border-radius: 10px; background: #1d1d1f;
      display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; font-weight: 800; flex-shrink: 0;
    }
    .brand-text { font-weight: 700; font-size: 18px; color: #1d1d1f; }

    /* Search Bar */
    .search-wrap { display: flex; justify-content: flex-end; align-items: center; flex: 1; position: relative; gap: 8px; }
    .search-box {
      display: flex; align-items: center; background: transparent; border-radius: 25px; transition: all 0.3s;
      overflow: hidden; height: 42px; width: 42px; 
    }
    .search-box.open { width: 100%; max-width: 250px; background: #fff; border: 1px solid #d1d1d6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .search-input {
      flex: 1; border: none; background: transparent; color: #111; padding: 0 0 0 16px; font-size: 14px; outline: none; font-weight: 500;
      width: 0; opacity: 0; transition: opacity 0.3s;
    }
    .search-box.open .search-input { width: 100%; opacity: 1; }
    
    .lens-btn { width: 42px; height: 42px; background: transparent; border: none; color: #333; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .suggest-box { position: absolute; top: 50px; right: 0; width: 100%; max-width: 300px; background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 200; overflow: hidden; }
    .suggest-item { padding: 12px 16px; cursor: pointer; color: #111; font-size: 14px; border-bottom: 1px solid #f2f2f7; display: flex; align-items: center; gap: 10px; font-weight: 500; }

    /* Categories */
    .cat-container { display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px; background: #fff; }
    .cat-container::-webkit-scrollbar { display: none; }
    .cat-btn { background: #f2f2f7; color: #666; border: none; border-radius: 20px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; display: flex; gap: 6px; align-items: center; }
    .cat-btn.active { background: #1d1d1f; color: #fff; }

    /* Main Content */
    .main-content { padding-bottom: 70px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #eaeaea; border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.3s; }
    .thumb-wrap { position: relative; padding-bottom: 56.25%; background: #f2f2f7; overflow: hidden; }
    .thumb-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 14px; }
    .vid-title { color: #111; font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .vid-channel { color: #666; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    
    #player-container { scroll-margin-top: 70px; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; width: 100%; height: 60px;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid #e5e5ea; display: flex; justify-content: space-around; align-items: center;
      z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 10px; font-weight: 600; cursor: pointer; width: 33%; height: 100%; gap: 4px; }
    .nav-item.active { color: #1d1d1f; }
    .nav-icon { font-size: 22px; transition: transform 0.2s; }
    .nav-item.active .nav-icon { transform: scale(1.15); color: #ff0055; }

    /* Shorts UI */
    .shorts-container { height: calc(100vh - 60px); overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; background: #000; }
    .short-item { height: 100%; width: 100%; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; }
    .short-info { position: absolute; bottom: 20px; left: 16px; right: 16px; z-index: 10; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.9); pointer-events: none; }
    .short-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .short-channel { font-size: 13px; font-weight: 500; display: inline-block; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px; backdrop-filter: blur(4px); }

    /* Skeletons */
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .skeleton { background: #fff; border: 1px solid #eaeaea; border-radius: 16px; overflow: hidden; }
    .skel-img { padding-bottom: 56.25%; background: #e5e5ea; animation: pulse 1.5s infinite; }
    .skel-text { height: 14px; background: #f2f2f7; margin: 14px; border-radius: 4px; animation: pulse 1.5s infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    let BACKEND_URL = "https://yt-free.onrender.com";

    const CATS = [
      { id: "all", icon: "🔥", label: "For You" },
      { id: "10",  icon: "🎵", label: "Music" },
      { id: "20",  icon: "🎮", label: "Gaming" },
      { id: "24",  icon: "🎭", label: "Entertainment" },
      { id: "17",  icon: "⚽", label: "Sports" },
      { id: "28",  icon: "💻", label: "Tech" },
      { id: "22",  icon: "👤", label: "Vlogs" }
    ];

    const POPULAR_TERMS = ["Song", "Movie", "Comedy", "News Live", "Cricket Highlights", "Bhojpuri Song", "Hindi Dubbed", "Gaming", "Tech Review", "Vlog", "Shorts", "Trending India"];
    
    const RANDOM_SEEDS = [
      "latest hindi songs", "trending india video", "new bollywood movie", "indian comedy", "tech reviews hindi", 
      "indian vlogs", "cricket highlights india", "indian street food", "bhojpuri hit songs", "punjabi latest songs", 
      "sourav joshi vlogs", "carryminati", "bgmi live india", "free fire india", "wwe hindi dubbed", 
      "tarak mehta ka ooltah chashmah", "kapil sharma show", "round2hell new video", "news live india", "standup comedy hindi"
    ];
    
    const SHORTS_SEEDS = ["#shorts viral india", "#shorts hindi comedy", "#shorts trending song", "#shorts dance india", "#shorts facts hindi"];

    function getVid(v) { return typeof v.id === "string" ? v.id : (v.id?.videoId || ""); }
    
    function App() {
      const [currentTab, setCurrentTab] = useState("home"); 
      const [videos, setVideos] = useState([]);
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(false);
      const [appending, setAppending] = useState(false);
      const [query, setQuery] = useState("");
      const [activeCat, setActiveCat] = useState("all");
      const [searchOpen, setSearchOpen] = useState(false);
      const [suggestions, setSuggestions] = useState([]);
      const [error, setError] = useState("");

      const [shortsVids, setShortsVids] = useState([]);
      const [shortIndex, setShortIndex] = useState(0);
      const [loadingShorts, setLoadingShorts] = useState(false);

      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem("yt_history");
        return saved ? JSON.parse(saved) : [];
      });

      function addToHistory(video) {
        setHistory(prev => {
          const filtered = prev.filter(v => getVid(v) !== getVid(video));
          const newHistory = [video, ...filtered].slice(0, 30);
          localStorage.setItem("yt_history", JSON.stringify(newHistory));
          return newHistory;
        });
      }

      function handleInputChange(val) {
        setQuery(val);
        if(val.trim().length > 0) {
          const matched = POPULAR_TERMS.filter(t => t.toLowerCase().includes(val.toLowerCase()));
          setSuggestions(matched);
        } else setSuggestions([]);
      }

      function executeSearch(searchWord) {
        setQuery(searchWord); setSuggestions([]); setSearchOpen(false);
        setActiveCat(""); setSelected(null); setCurrentTab("home");
        fetchVideos(null, false, searchWord);
      }

      // MAHA-FIX: Infinite Scroll Duplicate Issue Solved Permanently
      async function fetchVideos(cat, isAppend = false, customQuery = null) {
        if (isAppend) setAppending(true);
        else { setLoading(true); setVideos([]); setError(""); }
        try {
          let url = ""; 
          let finalQuery = customQuery !== null ? customQuery : query;
          
          // Category wise dynamic seeds so infinite scroll never stops
          const catLabels = {
            "10": ["latest hindi songs", "new punjabi songs", "bollywood hit music", "tseries new", "lofi mashup india"],
            "20": ["bgmi live gameplay", "free fire india", "gta 5 techno gamerz", "minecraft hindi", "total gaming"],
            "24": ["tarak mehta ka ooltah chashmah", "kapil sharma show latest", "round2hell new", "bb ki vines", "ashish chanchlani comedy"],
            "17": ["cricket highlights india", "wwe hindi dubbed", "ipl highlights", "sports tak live", "football highlights hindi"],
            "28": ["tech burner latest", "technical guruji new", "trakin tech", "mobile unboxing hindi", "pc build hindi"],
            "22": ["sourav joshi vlogs", "flying beast new", "mumbiker nikhil vlog", "uk07 rider", "daily vlog india"]
          };

          let randomSeed = "";
          if (cat && cat !== "all" && catLabels[cat]) {
             randomSeed = catLabels[cat][Math.floor(Math.random() * catLabels[cat].length)];
          } else {
             randomSeed = RANDOM_SEEDS[Math.floor(Math.random() * RANDOM_SEEDS.length)];
          }

          // Cache Buster adds extreme randomness to bypass Youtube duplicate responses
          const cacheBuster = ["new", "2026", "viral", "hd", "latest hits", "trending"][Math.floor(Math.random() * 6)];
          randomSeed += " " + cacheBuster;

          // Logic: ALWAYS use search endpoint when appending so we get fresh data
          if (isAppend) {
            let q = finalQuery ? (finalQuery + " " + cacheBuster) : randomSeed;
            url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(q)}&maxResults=24`;
          } else {
            if (finalQuery) {
              url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(finalQuery)}&maxResults=24`;
            } else if (cat && cat !== "all") {
              url = `${BACKEND_URL}/api/trending?categoryId=${cat}&maxResults=24`; // Trending for initial category load
            } else {
              url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(randomSeed)}&maxResults=24`;
            }
          }
          
          const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          
          if (data.items && data.items.length > 0) {
            const newVids = data.items.filter(v => getVid(v)); 
            if (isAppend) {
               setVideos(prev => {
                  const existingIds = new Set(prev.map(p => getVid(p)));
                  const uniqueNew = newVids.filter(nv => !existingIds.has(getVid(nv)));
                  return [...prev, ...uniqueNew];
               });
            } else {
               setVideos(newVids.sort(() => Math.random() - 0.5));
            }
          }
        } catch (e) { setError(e.message); }
        setLoading(false); setAppending(false);
      }

      useEffect(() => { fetchVideos("all"); }, []);

      // FIX: Improved scroll logic with Timeout Debounce to prevent multiple fire
      useEffect(() => {
        let timeoutId;
        const handleScroll = () => {
          if (currentTab !== "home" || loading || appending) return;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const docHeight = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          
          if (docHeight - (scrollTop + windowHeight) < 1500) {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
               fetchVideos(activeCat, true);
            }, 100);
          }
        };
        
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => {
           window.removeEventListener('scroll', handleScroll);
           clearTimeout(timeoutId);
        };
      }, [loading, appending, activeCat, query, currentTab]);

      const handleHomeRefresh = () => {
        setCurrentTab("home");
        setActiveCat("all");
        setQuery("");
        setSelected(null);
        window.scrollTo(0, 0);
        fetchVideos("all");
      };

      // MAHA-FIX: Bulletproof instant scroll top
      const handleVideoClick = (v) => {
        setSelected(v);
        addToHistory(v);
        
        // 1. Force instant scroll without animation
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        
        // 2. Fallback smooth scroll after React renders the player
        setTimeout(() => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 50);
      };

      function goFullscreen() {
        const iframe = document.getElementById("yt-iframe");
        if (iframe && iframe.requestFullscreen) {
          iframe.requestFullscreen().then(() => {
            if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
              window.screen.orientation.lock("landscape").catch(e => console.log(e));
            }
          }).catch(err => console.error(err));
        }
      }

      async function fetchShortsData(isAppend = false) {
        if (!isAppend) { setLoadingShorts(true); setShortsVids([]); setShortIndex(0); }
        try {
          const randomSeed = SHORTS_SEEDS[Math.floor(Math.random() * SHORTS_SEEDS.length)];
          const url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(randomSeed)}&maxResults=20`;
          const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data.items && data.items.length > 0) {
             const newVids = data.items.filter(v => getVid(v));
             if (isAppend) setShortsVids(prev => [...prev, ...newVids.filter(nv => !prev.some(pv => getVid(pv) === getVid(nv)))]);
             else setShortsVids(newVids.sort(() => Math.random() - 0.5));
          }
        } catch(e) {}
        setLoadingShorts(false);
      }

      useEffect(() => {
        if (currentTab === "shorts" && shortsVids.length === 0) { fetchShortsData(); }
      }, [currentTab]);

      function handleShortsScroll(e) {
        const container = e.target;
        const index = Math.round(container.scrollTop / container.clientHeight);
        if (index !== shortIndex) {
          setShortIndex(index);
          if (index >= shortsVids.length - 3 && !loadingShorts) fetchShortsData(true);
        }
      }

      useEffect(() => {
        let player;
        const initPlayer = () => {
          if (!window.YT || !window.YT.Player) return;
          const iframe = document.getElementById("short-iframe");
          if (iframe) {
            player = new window.YT.Player("short-iframe", {
              events: {
                'onStateChange': (event) => {
                  if (event.data === window.YT.PlayerState.ENDED) {
                    const container = document.querySelector('.shorts-container');
                    if (container) {
                      const nextScroll = container.scrollTop + container.clientHeight;
                      container.scrollTo({ top: nextScroll, behavior: 'smooth' });
                    }
                  }
                }
              }
            });
          }
        };

        if (currentTab === "shorts") {
          if (!window.YT) {
            const tag = document.createElement("script");
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName("script")[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            window.onYouTubeIframeAPIReady = initPlayer;
          } else {
            setTimeout(initPlayer, 500); 
          }
        }
        return () => { if (player && player.destroy) player.destroy(); };
      }, [currentTab, shortIndex]);
      return (
        <div>
          {currentTab !== "shorts" && (
            <div className="glass-header">
              <div className="brand-btn" onClick={handleHomeRefresh}>
                <div className="logo-box">▶</div>
                <span className="brand-text">Jugadu Tube</span>
              </div>
              
              <div className="search-wrap">
                <div className={`search-box ${searchOpen ? 'open' : ''}`}>
                  <input className="search-input" value={query} onChange={e => handleInputChange(e.target.value)} 
                    placeholder="Search movies, songs..." 
                    onKeyDown={e => { if(e.key==="Enter" && query.trim()){ executeSearch(query); } }} 
                    ref={input => searchOpen && input && input.focus()} />
                  <button className="lens-btn" onClick={() => {
                    if (searchOpen && query.trim()) { executeSearch(query); }
                    else { setSearchOpen(!searchOpen); setSuggestions([]); }
                  }}>🔍</button>
                </div>
                
                {searchOpen && suggestions.length > 0 && (
                  <div className="suggest-box">
                    {suggestions.map((s, i) => (
                      <div key={i} className="suggest-item" onClick={() => executeSearch(s)}>
                        <span>🔍</span> {s}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          <div className="main-content">
            {currentTab === "home" && (
              <div>
                {selected && (
                  <div id="player-container" style={{maxWidth:900, margin:"0 auto", padding:"16px"}}>
                    <div style={{position:"relative", paddingBottom:"56.25%", borderRadius:"16px", overflow:"hidden", background:"#000", boxShadow:"0 4px 20px rgba(0,0,0,0.1)"}}>
                      <iframe id="yt-iframe" src={`https://www.youtube-nocookie.com/embed/${getVid(selected)}?autoplay=1&rel=0`}
                        style={{position:"absolute", inset:0, width:"100%", height:"100%", border:"none"}} 
                        allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowFullScreen />
                    </div>
                    <h2 style={{fontSize:"17px", fontWeight:700, margin:"16px 0 10px", color:"#111"}}>{selected.snippet?.title}</h2>
                    
                    <div style={{display:"flex", alignItems:"center", gap:"10px", flexWrap:"wrap"}}>
                      <div style={{background:"#f2f2f7", padding:"8px 14px", borderRadius:"20px", fontSize:"13px", color:"#444", fontWeight:"500"}}>
                        👤 {selected.snippet?.channelTitle}
                      </div>
                      <button onClick={goFullscreen} style={{background:"#1d1d1f", color:"#fff", border:"none", padding:"8px 16px", borderRadius:"20px", fontSize:"13px", fontWeight:"600", cursor:"pointer", display:"flex", alignItems:"center", gap:"6px"}}>
                        🔄 Rotate & Full Screen
                      </button>
                    </div>
                  </div>
                )}

                {error && (
                  <div style={{background:"#fff3cd", border:"1px solid #ffc107", color:"#856404", padding:"12px 16px", margin:"0 16px", borderRadius:"8px", fontSize:"13px", marginTop:"10px"}}>
                    ⚠️ {error}
                  </div>
                )}

                {!selected && (
                  <div className="cat-container">
                    {CATS.map(cat => (
                      <button key={cat.id} className={`cat-btn ${activeCat === cat.id ? 'active' : ''}`}
                        onClick={() => { setActiveCat(cat.id); setQuery(""); fetchVideos(cat.id); setSearchOpen(false); }}>
                        {cat.icon} {cat.label}
                      </button>
                    ))}
                  </div>
                )}

                {selected && <h3 style={{padding:"0 16px", marginTop:"10px", color:"#111", fontSize:"16px", fontWeight:700}}>🔥 Up Next / Recommended</h3>}

                <div className="grid">
                  {loading ? Array(12).fill(0).map((_, i) => (
                    <div key={i} className="skeleton">
                      <div className="skel-img"></div>
                      <div className="skel-text"></div>
                      <div className="skel-text short"></div>
                    </div>
                  )) : videos.filter(v => getVid(v) !== (selected ? getVid(selected) : "")).map((v, index) => {
                    const s = v.snippet || {};
                    return (
                      <div key={getVid(v) + index} className="card" onClick={() => handleVideoClick(v)}>
                        <div className="thumb-wrap"><img src={s.thumbnails?.medium?.url || ""} loading="lazy" /></div>
                        <div className="card-info">
                          <div className="vid-title">{s.title}</div>
                          <div className="vid-channel">{s.channelTitle}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {appending && <div style={{textAlign:"center", padding:"20px", color:"#888"}}>Loading more... ⏳</div>}
              </div>
            )}

            {currentTab === "shorts" && (
              <div className="shorts-container" onScroll={handleShortsScroll}>
                {shortsVids.map((v, i) => {
                  const vidId = getVid(v); const s = v.snippet || {};
                  return (
                    <div key={vidId + i} className="short-item">
                      {shortIndex === i ? (
                        <iframe id="short-iframe" src={`https://www.youtube-nocookie.com/embed/${vidId}?autoplay=1&enablejsapi=1&controls=0&modestbranding=1&rel=0`}
                          style={{position:"absolute", inset:0, width:"100%", height:"100%", border:"none", pointerEvents:"auto"}}
                          allow="autoplay; encrypted-media; fullscreen" allowFullScreen />
                      ) : (
                        <img src={s.thumbnails?.high?.url || s.thumbnails?.medium?.url} loading="lazy" style={{position:"absolute", inset:0, width:"100%", height:"100%", objectFit:"cover", opacity: 0.3}} />
                      )}
                      <div className="short-info">
                        <div className="short-title">{s.title}</div>
                        <div className="short-channel">👤 {s.channelTitle}</div>
                      </div>
                    </div>
                  );
                })}
                {loadingShorts && <div style={{color:"#fff", textAlign:"center", padding:"40px", fontSize:"14px"}}>Loading... ⏳</div>}
              </div>
            )}

            {currentTab === "profile" && (
              <div style={{padding:"20px", maxWidth:"1200px", margin:"0 auto"}}>
                <div style={{textAlign:"center", marginBottom:"20px"}}>
                  <div style={{fontSize:"50px", marginBottom:"10px"}}>👤</div>
                  <h2 style={{color:"#111", fontSize:"22px", fontWeight:"700"}}>Library & History</h2>
                </div>
                
                <h3 style={{fontSize:"16px", fontWeight:700, margin:"10px 0", color:"#111", paddingLeft:"8px", borderLeft:"4px solid #ff0055"}}>🕒 Recently Watched</h3>
                
                {history.length === 0 ? (
                  <p style={{color:"#666", textAlign:"center", padding:"40px", background:"#fff", borderRadius:"12px", border:"1px solid #eaeaea"}}>Abhi tak koi video nahi dekhi hai 😅</p>
                ) : (
                  <div className="grid" style={{padding:"10px 0"}}>
                    {history.map((v, index) => {
                      const s = v.snippet || {};
                      return (
                        <div key={"hist" + getVid(v) + index} className="card" onClick={() => { setCurrentTab("home"); handleVideoClick(v); }}>
                          <div className="thumb-wrap"><img src={s.thumbnails?.medium?.url || s.thumbnails?.default?.url || ""} loading="lazy" /></div>
                          <div className="card-info">
                            <div className="vid-title">{s.title}</div>
                            <div className="vid-channel">{s.channelTitle}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
            
          </div>

          <div className="bottom-nav">
            <div className={`nav-item ${currentTab === "home" ? "active" : ""}`} onClick={() => { if(currentTab==='home') handleHomeRefresh(); else setCurrentTab("home"); }}>
              <div className="nav-icon">{currentTab === "home" ? "🏠" : "🏡"}</div>
              <span>Home</span>
            </div>
            
            <div className={`nav-item ${currentTab === "shorts" ? "active" : ""}`} onClick={() => setCurrentTab("shorts")}>
              <div className="nav-icon">{currentTab === "shorts" ? "📱" : "📱"}</div>
              <span>Shorts</span>
            </div>
            
            <div className={`nav-item ${currentTab === "profile" ? "active" : ""}`} onClick={() => setCurrentTab("profile")}>
              <div className="nav-icon">{currentTab === "profile" ? "👤" : "👤"}</div>
              <span>Library</span>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }
  </script>
</body>
</html>
