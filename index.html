<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>YT Clean 📺</title>
  <meta name="description" content="Clean YouTube without ads" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ffffff' rx='50' width='100' height='100'/><text y='75' font-size='70' font-weight='bold' fill='%23111' text-anchor='middle' x='54'>▶</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    /* White & Gray Light Theme */
    body { background: #f5f5f7; color: #1d1d1f; -webkit-tap-highlight-color: transparent; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f5f5f7; }
    ::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #999; }

    /* Header */
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e5ea;
      position: sticky; top: 0; z-index: 100;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }

    /* Lens Search Bar */
    .search-wrap { display: flex; justify-content: flex-end; flex: 1; }
    .search-box {
      display: flex; align-items: center; background: #e5e5ea;
      border-radius: 25px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden; height: 42px; width: 42px; /* Small Lens Mode */
    }
    .search-box.open { width: 100%; max-width: 320px; background: #ffffff; border: 1px solid #d1d1d6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .search-input {
      flex: 1; border: none; background: transparent; color: #1d1d1f; 
      padding: 0 0 0 16px; font-size: 14px; outline: none; font-weight: 500;
      width: 0; opacity: 0; transition: opacity 0.3s;
    }
    .search-box.open .search-input { width: 100%; opacity: 1; }
    .lens-btn {
      width: 42px; height: 42px; background: transparent; border: none;
      color: #666; font-size: 18px; cursor: pointer; display: flex; 
      align-items: center; justify-content: center; flex-shrink: 0; border-radius: 50%;
    }
    .lens-btn:hover { background: rgba(0,0,0,0.05); color: #111; }

    /* Categories */
    .cat-container { display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px; border-bottom: 1px solid #eaeaea; background: #fff; }
    .cat-container::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #f2f2f7; color: #666; border: 1px solid transparent; border-radius: 20px;
      padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: all 0.3s ease; display: flex; gap: 6px; align-items: center;
    }
    .cat-btn:hover { background: #e5e5ea; color: #111; }
    .cat-btn.active { background: #1d1d1f; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #ffffff; border: 1px solid #eaeaea; border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); border-color: #d1d1d6; }
    .thumb-wrap { position: relative; padding-bottom: 56.25%; background: #f2f2f7; overflow: hidden; }
    .thumb-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .card:hover .thumb-wrap img { transform: scale(1.03); }
    
    .card-info { padding: 14px; }
    .vid-title { color: #1d1d1f; font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .vid-channel { color: #666; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .vid-stats { color: #999; font-size: 11px; font-weight: 500; }

    /* Skeletons & Loaders */
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .skeleton { background: #fff; border: 1px solid #eaeaea; border-radius: 16px; overflow: hidden; }
    .skel-img { padding-bottom: 56.25%; background: #e5e5ea; animation: pulse 1.5s infinite; }
    .skel-text { height: 14px; background: #f2f2f7; margin: 14px; border-radius: 4px; animation: pulse 1.5s infinite; }
    .skel-text.short { width: 60%; margin-top: 0; }
    .bottom-loader { text-align: center; padding: 20px; color: #888; font-size: 14px; font-weight: 600; }

    .logo-box {
      width: 40px; height: 40px; border-radius: 12px; background: #1d1d1f;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const BACKEND_URL = "https://yt-free.onrender.com";

    const CATS = [
      { id: "all", icon: "🔥", label: "For You" },
      { id: "10",  icon: "🎵", label: "Music" },
      { id: "20",  icon: "🎮", label: "Gaming" },
      { id: "24",  icon: "🎭", label: "Entertainment" },
      { id: "17",  icon: "⚽", label: "Sports" },
      { id: "28",  icon: "💻", label: "Tech & Gadgets" },
      { id: "22",  icon: "👤", label: "Vlogs" }
    ];

    const RANDOM_SEEDS = ["latest viral", "trending india", "new songs", "comedy video", "tech reviews", "street food", "movies", "podcast clips", "gaming live", "shorts"];
    const SUFFIXES = ["new", "latest", "viral", "2024", "best", "highlights"];

    function fmt(n) {
      if (!n) return ""; const x = parseInt(n);
      if (x >= 1e9) return (x/1e9).toFixed(1)+"B";
      if (x >= 1e6) return (x/1e6).toFixed(1)+"M";
      if (x >= 1e3) return (x/1e3).toFixed(1)+"K";
      return String(x);
    }
    function ago(d) {
      if (!d) return ""; const days = Math.floor((Date.now() - new Date(d)) / 86400000);
      if (!days) return "New"; if (days < 7) return days + "d";
      if (days < 30) return Math.floor(days/7) + "w"; return Math.floor(days/30) + "mo";
    }
    function getVid(v) { return typeof v.id === "string" ? v.id : (v.id?.videoId || ""); }
    function App() {
      const [videos, setVideos] = useState([]);
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(false);
      const [appending, setAppending] = useState(false);
      const [query, setQuery] = useState("");
      const [activeCat, setActiveCat] = useState("all");
      const [searchOpen, setSearchOpen] = useState(false);

      // Smart Fetch (Randomizer & Unlimited Scroll)
      async function fetchVideos(cat, isAppend = false) {
        if (isAppend) setAppending(true);
        else { setLoading(true); setVideos([]); }
        
        try {
          let url = "";
          let randomSeed = RANDOM_SEEDS[Math.floor(Math.random() * RANDOM_SEEDS.length)];
          let randomSuffix = SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];

          if (query) {
            // Agar user ne kuch search kiya hai
            let q = isAppend ? `${query} ${randomSuffix}` : query;
            url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(q)}&maxResults=24`;
          } else if (cat && cat !== "all") {
            // Category ke liye
            if (isAppend) {
               let catLabel = CATS.find(c => c.id === cat).label;
               url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(catLabel + " " + randomSuffix)}&maxResults=24`;
            } else {
               url = `${BACKEND_URL}/api/trending?categoryId=${cat}&maxResults=24`;
            }
          } else {
            // "For You" - Hamesha Random Naye Videos layega
            url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(randomSeed)}&maxResults=24`;
          }
          
          const res = await fetch(url);
          const data = await res.json();
          
          if (!data.error && data.items) {
            // Duplicate videos hatane ka filter
            const newVids = data.items.filter(v => getVid(v)); 
            
            if (isAppend) {
              setVideos(prev => {
                const uniqueVids = newVids.filter(nv => !prev.some(pv => getVid(pv) === getVid(nv)));
                return [...prev, ...uniqueVids];
              });
            } else {
              // Shuffling taaki fresh look aaye
              setVideos(newVids.sort(() => Math.random() - 0.5));
            }
          }
        } catch (e) { console.error(e); }
        setLoading(false); setAppending(false);
      }

      useEffect(() => { fetchVideos("all"); }, []);

      // Scroll Event for Unlimited Videos
      useEffect(() => {
        const handleScroll = () => {
          if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800 && !loading && !appending && videos.length > 0) {
            fetchVideos(activeCat, true);
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, [loading, appending, activeCat, query, videos.length]);

      if (selected) {
        const vid = getVid(selected); const s = selected.snippet || {};
        return (
          <div>
            <div className="glass-header" style={{background:"#fff"}}>
              <button onClick={() => setSelected(null)} 
                style={{background:"#f2f2f7", border:"none", color:"#111", width:"40px", height:"40px", borderRadius:"50%", cursor:"pointer", fontSize:"20px"}}>
                ←
              </button>
              <h3 style={{fontWeight:600, fontSize:"14px", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", flex:1, marginLeft:"12px"}}>
                {s.title}
              </h3>
            </div>
            <div style={{maxWidth:900, margin:"0 auto", padding:"16px"}}>
              <div style={{position:"relative", paddingBottom:"56.25%", borderRadius:"16px", overflow:"hidden", background:"#000", boxShadow:"0 4px 20px rgba(0,0,0,0.1)"}}>
                <iframe src={`https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0`}
                  style={{position:"absolute", inset:0, width:"100%", height:"100%", border:"none"}} allowFullScreen />
              </div>
              <h2 style={{fontSize:"17px", fontWeight:700, margin:"16px 0 8px", color:"#111"}}>{s.title}</h2>
              <div style={{display:"flex", alignItems:"center", gap:"10px"}}>
                <div style={{background:"#f2f2f7", padding:"6px 14px", borderRadius:"20px", fontSize:"13px", color:"#444", fontWeight:"500"}}>
                  👤 {s.channelTitle}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div>
          <div className="glass-header">
            <div className="logo-box">▶</div>
            
            <div className="search-wrap">
              <div className={`search-box ${searchOpen ? 'open' : ''}`}>
                <input className="search-input" value={query} onChange={e => setQuery(e.target.value)} 
                  placeholder="Search clean..." 
                  onKeyDown={e => { if(e.key==="Enter"){ setActiveCat(""); fetchVideos(null); setSearchOpen(false); } }} 
                  ref={input => searchOpen && input && input.focus()} />
                <button className="lens-btn" onClick={() => {
                  if (searchOpen && query) { setActiveCat(""); fetchVideos(null); }
                  setSearchOpen(!searchOpen);
                }}>🔍</button>
              </div>
            </div>
          </div>

          <div className="cat-container">
            {CATS.map(cat => (
              <button key={cat.id} className={`cat-btn ${activeCat === cat.id ? 'active' : ''}`}
                onClick={() => { setActiveCat(cat.id); setQuery(""); fetchVideos(cat.id); setSearchOpen(false); }}>
                {cat.icon} {cat.label}
              </button>
            ))}
          </div>

          <div className="grid">
            {loading ? Array(12).fill(0).map((_, i) => (
              <div key={i} className="skeleton">
                <div className="skel-img"></div>
                <div className="skel-text"></div>
                <div className="skel-text short"></div>
              </div>
            )) : videos.map((v, index) => {
              const s = v.snippet || {}; const st = v.statistics || {};
              return (
                <div key={getVid(v) + index} className="card" onClick={() => setSelected(v)}>
                  <div className="thumb-wrap">
                    <img src={s.thumbnails?.medium?.url || ""} loading="lazy" />
                  </div>
                  <div className="card-info">
                    <div className="vid-title">{s.title}</div>
                    <div className="vid-channel">{s.channelTitle}</div>
                    <div className="vid-stats">
                      {st.viewCount ? fmt(st.viewCount)+" views • " : ""}{ago(s.publishedAt)}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          
          {appending && <div className="bottom-loader">Aur videos load ho rahe hain... ⏳</div>}

          {!loading && videos.length === 0 && (
            <div style={{textAlign:"center", padding:"60px 20px", color:"#888"}}>
              <div style={{fontSize:"50px", marginBottom:"15px"}}>🔍</div>
              <h3>Kuch nahi mila</h3>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }
  </script>
</body>
</html>
