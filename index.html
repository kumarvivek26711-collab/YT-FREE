<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Jugadu Tube 📺</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ff9800' rx='20' width='100' height='100'/><text y='75' font-size='70' font-weight='bold' fill='%23fff' text-anchor='middle' x='50'>J</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ff9800" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080808; font-family: 'Segoe UI', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    const BACKEND_URL = "https://yt-free.onrender.com";

    const CATS = [
      { id: "all", icon: "🔥", label: "Trending" },
      { id: "10",  icon: "🎵", label: "Music" },
      { id: "20",  icon: "🎮", label: "Gaming" },
      { id: "24",  icon: "🎭", label: "Entertainment" },
      { id: "17",  icon: "⚽", label: "Sports" },
      { id: "25",  icon: "📰", label: "News" },
    ];

    function fmt(n) {
      if (!n) return "";
      const x = parseInt(n);
      if (x >= 1e9) return (x/1e9).toFixed(1)+"B";
      if (x >= 1e6) return (x/1e6).toFixed(1)+"M";
      if (x >= 1e3) return (x/1e3).toFixed(1)+"K";
      return String(x);
    }

    function ago(d) {
      if (!d) return "";
      const days = Math.floor((Date.now() - new Date(d)) / 86400000);
      if (!days) return "Aaj";
      if (days < 7) return days + "d";
      if (days < 30) return Math.floor(days/7) + "w";
      return Math.floor(days/30) + "mo";
    }

    function getVid(v) {
      return typeof v.id === "string" ? v.id : (v.id?.videoId || "");
    }

    function Card({ v, onSelect }) {
      const s = v.snippet || {};
      const st = v.statistics || {};
      const thumb = s.thumbnails?.medium?.url || "";

      return (
        <div onClick={() => onSelect(v)} style={{cursor:"pointer"}}>
          <div style={{position:"relative",paddingBottom:"56.25%",borderRadius:10,overflow:"hidden",background:"#1a1a1a",marginBottom:8}}>
            <img src={thumb} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} />
          </div>
          <p style={{margin:"0 0 4px",color:"#fff",fontSize:13,fontWeight:600,lineHeight:1.3,
            display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
            {s.title}
          </p>
          <p style={{margin:"0 0 2px",color:"#999",fontSize:11}}>{s.channelTitle}</p>
          <p style={{margin:0,color:"#666",fontSize:11}}>
            {st.viewCount ? fmt(st.viewCount)+" views" : ""} 
            {st.viewCount && s.publishedAt ? " • " : ""}
            {ago(s.publishedAt)}
          </p>
        </div>
      );
    }

    function App() {
      const [videos, setVideos] = useState([]);
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [query, setQuery] = useState("");
      const [activeCat, setActiveCat] = useState("all");
      const [pullDist, setPullDist] = useState(0);

      // Fetch videos
      async function fetchVideos(cat, append = false) {
        setLoading(true);
        setError("");
        
        try {
          let url = `${BACKEND_URL}/api/trending?maxResults=24`;
          if (cat !== "all") url += `&categoryId=${cat}`;
          
          if (query) {
            url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}&maxResults=24`;
          }
          
          const res = await fetch(url);
          const data = await res.json();
          
          if (data.error) throw new Error(data.error);
          
          if (append) {
            setVideos(v => [...v, ...(data.items || [])]);
          } else {
            setVideos(data.items || []);
          }
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      }

      // Initial load
      useEffect(() => {
        fetchVideos("all");
      }, []);

      // Pull to refresh
      useEffect(() => {
        let startY = 0;
        
        const handleTouchStart = (e) => {
          startY = e.touches[0].clientY;
        };

        const handleTouchMove = (e) => {
          if (window.scrollY === 0) {
            const dist = e.touches[0].clientY - startY;
            if (dist > 0) setPullDist(dist);
          }
        };

        const handleTouchEnd = () => {
          if (pullDist > 80) {
            fetchVideos(activeCat);
          }
          setPullDist(0);
        };

        window.addEventListener('touchstart', handleTouchStart);
        window.addEventListener('touchmove', handleTouchMove);
        window.addEventListener('touchend', handleTouchEnd);

        return () => {
          window.removeEventListener('touchstart', handleTouchStart);
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('touchend', handleTouchEnd);
        };
      }, [pullDist, activeCat]);

      // Infinite scroll
      useEffect(() => {
        const handleScroll = () => {
          if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500 && !loading && videos.length > 0) {
            fetchVideos(query ? null : activeCat, true);
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, [loading, activeCat, query, videos.length]);

      if (selected) {
        const vid = getVid(selected);
        const s = selected.snippet || {};
        
        return (
          <div style={{background:"#080808",minHeight:"100vh"}}>
            <div style={{background:"#0f0f0f",padding:"10px 14px",display:"flex",gap:10}}>
              <button onClick={() => setSelected(null)} style={{background:"#222",border:"none",color:"#fff",width:36,height:36,borderRadius:8,cursor:"pointer",fontSize:18}}>
                ←
              </button>
              <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search..." 
                style={{flex:1,background:"#111",border:"1px solid #222",color:"#fff",padding:"8px 12px",borderRadius:8,fontSize:13}}
                onKeyDown={e => e.key==="Enter" && fetchVideos(null)}
              />
            </div>

            <div style={{maxWidth:900,margin:"0 auto",padding:"14px"}}>
              <div style={{position:"relative",paddingBottom:"56.25%",borderRadius:12,overflow:"hidden",background:"#000",marginBottom:14}}>
                <iframe src={`https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0`}
                  style={{position:"absolute",inset:0,width:"100%",height:"100%",border:"none"}}
                  allowFullScreen />
              </div>
              <h2 style={{color:"#fff",fontSize:15,fontWeight:700,marginBottom:10}}>{s.title}</h2>
              <p style={{color:"#999",fontSize:12}}>{s.channelTitle}</p>
            </div>
          </div>
        );
      }

      return (
        <div style={{background:"#080808",minHeight:"100vh"}}>
          {/* Header */}
          <div style={{background:"#0f0f0f",padding:"10px 14px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:100}}>
            <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#ff9800,#ffb74d)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,color:"#fff"}}>J</div>
            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search..." 
              style={{flex:1,background:"#111",border:"1px solid #222",color:"#fff",padding:"8px 12px",borderRadius:8,fontSize:13}}
              onKeyDown={e => e.key==="Enter" && (setVideos([]), fetchVideos(null))}
            />
          </div>

          {/* Categories */}
          <div style={{overflowX:"auto",padding:"10px 14px",borderBottom:"1px solid #111",display:"flex",gap:8}}>
            {CATS.map(cat => (
              <button key={cat.id} onClick={() => {setActiveCat(cat.id); fetchVideos(cat.id);}}
                style={{
                  background: activeCat===cat.id ? "#ff9800" : "#1a1a1a",
                  color: activeCat===cat.id ? "#000" : "#bbb",
                  border:"none",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,
                  fontWeight: activeCat===cat.id ? 700 : 400,flexShrink:0,whiteSpace:"nowrap"
                }}>
                {cat.icon} {cat.label}
              </button>
            ))}
          </div>

          {/* Pull indicator */}
          {pullDist > 0 && (
            <div style={{textAlign:"center",color:"#666",fontSize:11,padding:"10px"}}>
              ⬇ Pull {Math.round(pullDist)}px
            </div>
          )}

          {/* Videos */}
          <div style={{maxWidth:1200,margin:"0 auto",padding:"14px"}}>
            {error && <div style={{background:"#330000",color:"#ff9999",padding:12,borderRadius:8,marginBottom:14}}>{error}</div>}
            
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:16}}>
              {videos.map(v => <Card key={getVid(v)} v={v} onSelect={setSelected} />)}
            </div>

            {loading && <div style={{textAlign:"center",color:"#666",padding:20}}>Loading...</div>}
            {!loading && videos.length === 0 && <div style={{textAlign:"center",color:"#666",padding:40}}>Search करो या category choose करो</div>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
