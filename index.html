<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Jugadu Tube 📺</title>
  <meta name="description" content="Clean YouTube without ads" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ffffff' rx='50' width='100' height='100'/><text y='75' font-size='70' font-weight='bold' fill='%23111' text-anchor='middle' x='54'>▶</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #f5f5f7; color: #1d1d1f; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f5f5f7; }
    ::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }

    /* Header */
    .glass-header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e5ea;
      position: sticky; top: 0; z-index: 100;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    
    .brand-btn { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-box {
      width: 36px; height: 36px; border-radius: 10px; background: #1d1d1f;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #fff; font-weight: 800; flex-shrink: 0;
    }
    .brand-text { font-weight: 700; font-size: 18px; color: #1d1d1f; }

    /* Search Bar & Dropdown */
    .search-wrap { display: flex; justify-content: flex-end; flex: 1; position: relative; }
    .search-box {
      display: flex; align-items: center; background: transparent;
      border-radius: 25px; transition: all 0.3s;
      overflow: hidden; height: 42px; width: 42px; 
    }
    .search-box.open { width: 100%; max-width: 300px; background: #fff; border: 1px solid #d1d1d6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .search-input {
      flex: 1; border: none; background: transparent; color: #111; 
      padding: 0 0 0 16px; font-size: 14px; outline: none; font-weight: 500;
      width: 0; opacity: 0; transition: opacity 0.3s;
    }
    .search-box.open .search-input { width: 100%; opacity: 1; }
    
    /* Bigger Transparent Lens */
    .lens-btn {
      width: 42px; height: 42px; background: transparent; border: none;
      color: #333; font-size: 22px; cursor: pointer; display: flex; 
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    
    /* Recommendations Box */
    .suggest-box {
      position: absolute; top: 50px; right: 0; width: 100%; max-width: 300px;
      background: #fff; border: 1px solid #e5e5ea; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 200; overflow: hidden;
    }
    .suggest-item {
      padding: 12px 16px; cursor: pointer; color: #111; font-size: 14px;
      border-bottom: 1px solid #f2f2f7; display: flex; align-items: center; gap: 10px; font-weight: 500;
    }
    .suggest-item:hover { background: #f5f5f7; }

    /* Categories */
    .cat-container { display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px; background: #fff; }
    .cat-container::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #f2f2f7; color: #666; border: none; border-radius: 20px;
      padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: 0.2s; display: flex; gap: 6px; align-items: center;
    }
    .cat-btn.active { background: #1d1d1f; color: #fff; }

    /* Video Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #eaeaea; border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.3s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px rgba(0,0,0,0.06); }
    .thumb-wrap { position: relative; padding-bottom: 56.25%; background: #f2f2f7; overflow: hidden; }
    .thumb-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    
    .card-info { padding: 14px; }
    .vid-title { color: #111; font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .vid-channel { color: #666; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .vid-stats { color: #999; font-size: 11px; }

    /* Ads Space */
    .ad-banner { background: #f2f2f7; border: 2px dashed #ccc; border-radius: 12px; padding: 16px; text-align: center; color: #888; font-size: 13px; font-weight: 600; margin: 16px auto; max-width: 900px; }

    /* Skeletons */
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .skeleton { background: #fff; border: 1px solid #eaeaea; border-radius: 16px; overflow: hidden; }
    .skel-img { padding-bottom: 56.25%; background: #e5e5ea; animation: pulse 1.5s infinite; }
    .skel-text { height: 14px; background: #f2f2f7; margin: 14px; border-radius: 4px; animation: pulse 1.5s infinite; }
    .skel-text.short { width: 60%; margin-top: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const BACKEND_URL = "https://yt-free.onrender.com";

    const CATS = [
      { id: "all", icon: "🔥", label: "For You" },
      { id: "10",  icon: "🎵", label: "Music" },
      { id: "20",  icon: "🎮", label: "Gaming" },
      { id: "24",  icon: "🎭", label: "Entertainment" },
      { id: "17",  icon: "⚽", label: "Sports" },
      { id: "28",  icon: "💻", label: "Tech" },
      { id: "22",  icon: "👤", label: "Vlogs" }
    ];

    // Desi search words (India only)
    const POPULAR_TERMS = ["Song", "Movie", "Comedy", "News Live", "Cricket Highlights", "Bhojpuri Song", "Hindi Dubbed", "Gaming", "Tech Review", "Vlog", "Shorts", "Trending India"];
    const RANDOM_SEEDS = ["latest hindi songs", "trending india video", "new bollywood movie", "indian comedy", "tech reviews hindi", "indian vlogs", "cricket india", "indian street food"];

    function fmt(n) {
      if (!n) return ""; const x = parseInt(n);
      if (x >= 1e9) return (x/1e9).toFixed(1)+"B";
      if (x >= 1e6) return (x/1e6).toFixed(1)+"M";
      if (x >= 1e3) return (x/1e3).toFixed(1)+"K";
      return String(x);
    }
    function ago(d) {
      if (!d) return ""; const days = Math.floor((Date.now() - new Date(d)) / 86400000);
      if (!days) return "New"; if (days < 7) return days + "d";
      if (days < 30) return Math.floor(days/7) + "w"; return Math.floor(days/30) + "mo";
    }
    function getVid(v) { return typeof v.id === "string" ? v.id : (v.id?.videoId || ""); }
    function App() {
      const [videos, setVideos] = useState([]);
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(false);
      const [appending, setAppending] = useState(false);
      const [query, setQuery] = useState("");
      const [activeCat, setActiveCat] = useState("all");
      const [searchOpen, setSearchOpen] = useState(false);
      const [suggestions, setSuggestions] = useState([]);

      function handleInputChange(val) {
        setQuery(val);
        if(val.trim().length > 0) {
          const matched = POPULAR_TERMS.filter(t => t.toLowerCase().includes(val.toLowerCase()));
          setSuggestions(matched);
        } else {
          setSuggestions([]);
        }
      }

      function executeSearch(searchWord) {
        setQuery(searchWord);
        setSuggestions([]);
        setSearchOpen(false);
        setActiveCat("");
        setSelected(null);
        fetchVideos(null, false, searchWord);
      }

      async function fetchVideos(cat, isAppend = false, customQuery = null) {
        if (isAppend) setAppending(true);
        else { setLoading(true); setVideos([]); }
        
        try {
          let url = "";
          let finalQuery = customQuery !== null ? customQuery : query;
          let randomSeed = RANDOM_SEEDS[Math.floor(Math.random() * RANDOM_SEEDS.length)];

          if (finalQuery) {
            // Force Indian Search
            let backendQuery = finalQuery;
            if (!backendQuery.toLowerCase().includes("india") && !backendQuery.toLowerCase().includes("hindi")) {
              backendQuery += " India";
            }
            url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(backendQuery)}&maxResults=24`;
          } else if (cat && cat !== "all") {
            if (isAppend) {
               let catLabel = CATS.find(c => c.id === cat).label;
               url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(catLabel + " India")}&maxResults=24`;
            } else {
               url = `${BACKEND_URL}/api/trending?categoryId=${cat}&maxResults=24`;
            }
          } else {
            url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(randomSeed)}&maxResults=24`;
          }
          
          const res = await fetch(url);
          const data = await res.json();
          
          if (!data.error && data.items) {
            const newVids = data.items.filter(v => getVid(v)); 
            if (isAppend) {
              setVideos(prev => {
                const uniqueVids = newVids.filter(nv => !prev.some(pv => getVid(pv) === getVid(nv)));
                return [...prev, ...uniqueVids];
              });
            } else {
              setVideos(newVids.sort(() => Math.random() - 0.5));
            }
          }
        } catch (e) { console.error(e); }
        setLoading(false); setAppending(false);
      }

      useEffect(() => { fetchVideos("all"); }, []);

      useEffect(() => {
        const handleScroll = () => {
          if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800 && !loading && !appending && videos.length > 0) {
            fetchVideos(activeCat, true);
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, [loading, appending, activeCat, query, videos.length]);

      function handleVideoClick(v) {
        setSelected(v);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      return (
        <div>
          <div className="glass-header">
            <div className="brand-btn" onClick={() => window.location.reload()}>
              <div className="logo-box">▶</div>
              <span className="brand-text">Jugadu Tube</span>
            </div>
            
            <div className="search-wrap">
              <div className={`search-box ${searchOpen ? 'open' : ''}`}>
                <input className="search-input" value={query} onChange={e => handleInputChange(e.target.value)} 
                  placeholder="Search movies, songs..." 
                  onKeyDown={e => { if(e.key==="Enter" && query.trim()){ executeSearch(query); } }} 
                  ref={input => searchOpen && input && input.focus()} />
                <button className="lens-btn" onClick={() => {
                  if (searchOpen && query.trim()) { executeSearch(query); }
                  else { setSearchOpen(!searchOpen); setSuggestions([]); }
                }}>🔍</button>
              </div>
              
              {searchOpen && suggestions.length > 0 && (
                <div className="suggest-box">
                  {suggestions.map((s, i) => (
                    <div key={i} className="suggest-item" onClick={() => executeSearch(s)}>
                      <span>🔍</span> {s}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Playing Video Section */}
          {selected && (
            <div style={{maxWidth:900, margin:"0 auto", padding:"16px", animation:"pulse 0.5s"}}>
              <div style={{position:"relative", paddingBottom:"56.25%", borderRadius:"16px", overflow:"hidden", background:"#000", boxShadow:"0 4px 20px rgba(0,0,0,0.1)"}}>
                <iframe src={`https://www.youtube-nocookie.com/embed/${getVid(selected)}?autoplay=1&rel=0`}
                  style={{position:"absolute", inset:0, width:"100%", height:"100%", border:"none"}} allowFullScreen />
              </div>
              <h2 style={{fontSize:"17px", fontWeight:700, margin:"16px 0 8px", color:"#111"}}>{selected.snippet?.title}</h2>
              <div style={{display:"inline-block", background:"#f2f2f7", padding:"6px 14px", borderRadius:"20px", fontSize:"13px", color:"#444", fontWeight:"500"}}>
                👤 {selected.snippet?.channelTitle}
              </div>
            </div>
          )}

          {/* Ad Placement */}
          <div className="ad-banner">
            💰 AdSpace (Your Ad Here)
          </div>

          {/* Categories (Hide while watching a video for cleaner look) */}
          {!selected && (
            <div className="cat-container">
              {CATS.map(cat => (
                <button key={cat.id} className={`cat-btn ${activeCat === cat.id ? 'active' : ''}`}
                  onClick={() => { setActiveCat(cat.id); setQuery(""); fetchVideos(cat.id); setSearchOpen(false); }}>
                  {cat.icon} {cat.label}
                </button>
              ))}
            </div>
          )}

          {selected && <h3 style={{padding:"0 16px", marginTop:"10px", color:"#111", fontSize:"16px", fontWeight:700}}>🔥 Up Next / Recommended</h3>}

          {/* Grid - Reused for both Home page and Recommended Videos */}
          <div className="grid">
            {loading ? Array(12).fill(0).map((_, i) => (
              <div key={i} className="skeleton">
                <div className="skel-img"></div>
                <div className="skel-text"></div>
                <div className="skel-text short"></div>
              </div>
            )) : videos.filter(v => getVid(v) !== (selected ? getVid(selected) : "")).map((v, index) => {
              const s = v.snippet || {}; const st = v.statistics || {};
              return (
                <div key={getVid(v) + index} className="card" onClick={() => handleVideoClick(v)}>
                  <div className="thumb-wrap">
                    <img src={s.thumbnails?.medium?.url || ""} loading="lazy" />
                  </div>
                  <div className="card-info">
                    <div className="vid-title">{s.title}</div>
                    <div className="vid-channel">{s.channelTitle}</div>
                    <div className="vid-stats">
                      {st.viewCount ? fmt(st.viewCount)+" views • " : ""}{ago(s.publishedAt)}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          
          {appending && <div style={{textAlign:"center", padding:"20px", color:"#888"}}>Loading more videos... ⏳</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }
  </script>
</body>
</html>
