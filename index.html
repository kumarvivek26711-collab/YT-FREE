<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tech Jugad 📺</title>
  <link rel="icon" href="Tech_Jugad_150x150.png" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { --bg-main: #f5f5f7; --bg-header: rgba(255, 255, 255, 0.95); --bg-card: #ffffff; --bg-hover: #f2f2f7; --text-main: #1d1d1f; --text-muted: #666666; --border: #e5e5ea; --accent: #00a8ff; }
    [data-theme="dark"] { --bg-main: #050505; --bg-header: rgba(5, 5, 5, 0.95); --bg-card: #111111; --bg-hover: #1f1f1f; --text-main: #ffffff; --text-muted: #aaaaaa; --border: #222222; --accent: #00a8ff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body, html { background: var(--bg-main); color: var(--text-main); overflow-x: hidden; scroll-behavior: smooth; min-height: 100vh; }
    ::-webkit-scrollbar { width: 0px; display: none; } 
    .glass-header { background: var(--bg-header); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .logo-box { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 8px rgba(0, 168, 255, 0.6); }
    .logo-box img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text { font-weight: 700; font-size: 16px; color: var(--text-main); }
    .search-wrap { display: flex; justify-content: flex-end; align-items: center; flex: 1; position: relative; gap: 6px; }
    .search-box { display: flex; align-items: center; background: transparent; border-radius: 20px; overflow: hidden; height: 38px; width: 38px; }
    .search-box.open { width: 100%; max-width: 250px; background: var(--bg-card); border: 1px solid var(--border); }
    .search-input { flex: 1; border: none; background: transparent; color: var(--text-main); padding: 0 12px; font-size: 13px; outline: none; width: 0; opacity: 0; transition: 0.3s; }
    .search-box.open .search-input { width: 100%; opacity: 1; }
    .icon-btn { width: 38px; height: 38px; background: transparent; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .cat-container { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; background: var(--bg-main); border-bottom: 1px solid var(--border); }
    .cat-container::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); border-radius: 16px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: var(--accent); color: #fff; }
    .main-content { padding-bottom: 70px; min-height: 100vh; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; padding: 12px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; }
    .thumb-wrap { position: relative; padding-bottom: 56.25%; background: var(--bg-hover); overflow: hidden; }
    .thumb-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .vid-duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 6px; }
    .card-info { padding: 10px; }
    .vid-title { color: var(--text-main); font-size: 13px; font-weight: 600; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .vid-stats { color: var(--text-muted); font-size: 11px; margin-top: 3px; }
    .action-btn { background: var(--bg-hover); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: var(--text-main); font-weight: 600; cursor: pointer; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 56px; background: var(--bg-header); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; cursor: pointer; }
    .nav-item.active { color: var(--accent); }
    .shorts-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; background: #000; }
    .short-item { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const BACKEND_URL = "https://yt-free.onrender.com";

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem("yt_theme") || "dark");
      useEffect(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);
      const [currentTab, setCurrentTab] = useState("home");
      const [videos, setVideos] = useState([]);
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(false);
      const [query, setQuery] = useState("");
      
      async function fetchVideos(cat = "all", isAppend = false, q = "") {
        setLoading(true);
        let url = `${BACKEND_URL}/api/search?q=${encodeURIComponent(q || "latest hindi -shorts")}&maxResults=24`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data.items) setVideos(prev => isAppend ? [...prev, ...data.items] : data.items);
        } catch(e) { console.error(e); }
        setLoading(false);
      }

      useEffect(() => { fetchVideos(); }, []);

      window.onscroll = () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500 && !loading) {
          fetchVideos("all", true, query);
        }
      };

      return (
        <div>
          {currentTab !== "shorts" && (
            <div className="glass-header">
              <div className="brand-btn" onClick={() => window.location.reload()}>
                <div className="logo-box"><img src="Tech_Jugad_150x150.png" /></div>
                <span className="brand-text">Tech Jugad</span>
              </div>
              <div className="search-wrap">
                <button className="icon-btn" onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}>🌓</button>
                <input className="search-input" style={{width:100, opacity:1}} placeholder="Search..." onKeyDown={e => e.key === 'Enter' && fetchVideos("all", false, e.target.value)} />
              </div>
            </div>
          )}

          <div className="main-content">
            {currentTab === "home" && (
              <div>
                {selected && (
                  <div style={{padding:10}}>
                    <iframe src={`https://www.youtube-nocookie.com/embed/${selected.id.videoId || selected.id}?autoplay=1`} style={{width:"100%", height:250, border:0}} allowFullScreen />
                    <h3 style={{marginTop:10}}>{selected.snippet.title}</h3>
                    <button className="action-btn" onClick={() => setSelected(null)}>Back to Home</button>
                  </div>
                )}
                <div className="grid">
                  {videos.map((v, i) => (
                    <div key={i} className="card" onClick={() => { setSelected(v); window.scrollTo(0,0); }}>
                      <div className="thumb-wrap"><img src={v.snippet.thumbnails.medium.url} /><span className="vid-duration">HD</span></div>
                      <div className="card-info"><div className="vid-title">{v.snippet.title}</div></div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {currentTab === "shorts" && (
              <div className="shorts-container">
                 <div className="short-item"><div style={{color:'#fff'}}>Shorts Section Ready! Swipe Up..</div></div>
              </div>
            )}
          </div>

          <div className="bottom-nav">
            <div className={`nav-item ${currentTab === "home" ? "active" : ""}`} onClick={() => setCurrentTab("home")}>🏠<span>Home</span></div>
            <div className={`nav-item ${currentTab === "shorts" ? "active" : ""}`} onClick={() => setCurrentTab("shorts")}>📱<span>Shorts</span></div>
            <div className={`nav-item ${currentTab === "profile" ? "active" : ""}`} onClick={() => setCurrentTab("profile")}>❤️<span>Library</span></div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
